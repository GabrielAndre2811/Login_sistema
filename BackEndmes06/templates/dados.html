{% extends "base.html" %}

{% block content %}
{% block title %} Meus Dados {% endblock %}

<div class="container mt-5">
    <h2>Meus Dados</h2>

    <p><strong>Nome:</strong> {{ user.nome }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Telefone:</strong> {{ user.telefone }}</p>
   
    <a href="{{ url_for('main.index') }}" class="btn btn-secondary"> Voltar</a>

    <form action="{{url_for('user.deletar_usuario', user_id=usuario.id)}}"
        method="post" style="display: inline">  

        <button class="btn btn-danger">Excluir Usuário</button>
    
    </form>

    <form action="{{url_for('user.editar_usuario', user_id=usuario.id)}}"
        method="get" style="display: inline">  

        <button class="btn btn-primary">Editar Dados</button>
    
    </form>

</div>

{% endblock %}
