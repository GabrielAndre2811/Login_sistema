{% extends "base.html" %}

{% block content %}
{% block title %}Edita Usuario{% endblock %}
    <h1>Editar Usuario</h1>
    
    <form action="" method="post">
        
        <label for="name">Nome:</label><br>
        <input type="text" id="name" name="nome" value="{{ usuario.nome }}" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" value="{{ usuario.email }}" required><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" value="{{ usuario.telefone }}" required><br><br>

        <input type="submit" value="Enviar">
        
    </form>

{% endblock %}
